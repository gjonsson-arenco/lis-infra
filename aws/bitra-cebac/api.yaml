AWSTemplateFormatVersion: '2010-09-09'
Description: >
  bitra cebac: bitra-api (Laravel) en ECS Fargate, detras del ALB comun y de
  CloudFront (api.cebac.bitra-care.com, sin cache).

Parameters:
  ImageTag:
    Type: String
    Description: Tag de bitra-api en ECR (cebac-<sha>).
  DesiredCount:
    Type: Number
    Default: 1
  Domain:
    Type: String
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  EdgeCertificateArn:
    Type: String
    Description: Certificado de CloudFront (us-east-1), salida del stack edge-cert.
  OriginVerify:
    Type: String
    NoEcho: true
    Description: Valor del header X-Origin-Verify (SSM /bitra/cebac/cloudfront/origin-verify).
  DocumentsBucket:
    Type: String
    Description: Bucket de los informes, el de v1 en produccion. Solo lectura.
  DbHost:
    Type: String
  DbDatabase:
    Type: String
  DbUsername:
    Type: String

Resources:
  # ---------------------------------------------------------------------------
  # Lo que puede hacer el back
  # ---------------------------------------------------------------------------
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bitra-cebac-api-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: storage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # El bucket de v1 no se toca: solo lectura, desde este rol.
              - Sid: ReadDocuments
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${DocumentsBucket}/*
              - Sid: ListDocuments
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: !Sub arn:${AWS::Partition}:s3:::${DocumentsBucket}
              - Sid: Uploads
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub
                  - '${Bucket}/*'
                  - Bucket: !ImportValue bitra-cebac-uploads-bucket-arn
              - Sid: ListUploads
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: !ImportValue bitra-cebac-uploads-bucket-arn
              # Por si el bucket de v1 cifra con KMS.
              - Sid: KmsViaS3
                Effect: Allow
                Action: [kms:Decrypt]
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub s3.${AWS::Region}.amazonaws.com
        - PolicyName: cognito
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminDeleteUserAttributes
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminUserGlobalSignOut
                  - cognito-idp:AdminDeleteUser
                Resource: !ImportValue bitra-cebac-user-pool-arn

  # ---------------------------------------------------------------------------
  # Task y service
  # ---------------------------------------------------------------------------
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: bitra-cebac-api
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !ImportValue bitra-cebac-execution-role-arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub
            - '${Repository}:${ImageTag}'
            - Repository: !ImportValue bitra-cebac-api-repository-uri
          Essential: true
          PortMappings:
            - Name: api
              ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue bitra-cebac-api-log-group
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          Environment:
            - { Name: APP_NAME, Value: bitra }
            - { Name: APP_ENV, Value: production }
            - { Name: APP_DEBUG, Value: 'false' }
            - { Name: APP_URL, Value: !Sub 'https://api.${Domain}' }
            - { Name: FRONT_URL, Value: !Sub 'https://${Domain}' }
            - { Name: CORS_ALLOWED_ORIGINS, Value: !Sub 'https://${Domain}' }
            - { Name: APP_LOCALE, Value: es }
            - { Name: APP_FALLBACK_LOCALE, Value: es }
            - { Name: LOG_CHANNEL, Value: stderr }
            - { Name: LOG_LEVEL, Value: info }
            # Detras de CloudFront y el ALB (ver ClientIpFromHeader).
            - { Name: TRUSTED_PROXIES, Value: '*' }
            - { Name: CLIENT_IP_HEADER, Value: CloudFront-Viewer-Address }
            - { Name: DB_CONNECTION, Value: mysql }
            - { Name: DB_HOST, Value: !Ref DbHost }
            - { Name: DB_PORT, Value: '3306' }
            - { Name: DB_DATABASE, Value: !Ref DbDatabase }
            - { Name: DB_USERNAME, Value: !Ref DbUsername }
            - { Name: SESSION_DRIVER, Value: array }
            - { Name: CACHE_STORE, Value: file }
            - { Name: QUEUE_CONNECTION, Value: sync }
            - { Name: FILESYSTEM_DISK, Value: local }
            - { Name: AUTH_TOKEN_DRIVER, Value: cognito }
            - { Name: AUTH_USER_ID_CLAIM, Value: 'custom:hb_user_id' }
            - { Name: AUTH_TOKEN_USE, Value: id }
            - { Name: IDENTITY_DRIVER, Value: cognito }
            - { Name: COGNITO_REGION, Value: !Ref AWS::Region }
            - { Name: COGNITO_USER_POOL_ID, Value: !ImportValue bitra-cebac-user-pool-id }
            - { Name: COGNITO_CLIENT_ID, Value: !ImportValue bitra-cebac-app-client-id }
            - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
            - { Name: DOCUMENTS_DISK, Value: s3 }
            - { Name: AWS_BUCKET, Value: !Ref DocumentsBucket }
            - { Name: UPLOADS_DISK, Value: s3-uploads }
            - { Name: UPLOADS_AWS_BUCKET, Value: !ImportValue bitra-cebac-uploads-bucket }
            # lis-messaging por Service Connect.
            - { Name: MESSAGING_DRIVER, Value: http }
            - { Name: MESSAGING_URL, Value: 'http://lis-messaging:3040' }
            - { Name: PHONE_COUNTRY_CODE, Value: '54' }
            - { Name: PHONE_MOBILE_PREFIX, Value: '9' }
          Secrets:
            - Name: APP_KEY
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bitra/cebac/api/app-key
            - Name: DB_PASSWORD
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bitra/cebac/api/db-password
            - Name: MESSAGING_INTERNAL_TOKEN
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bitra/cebac/messaging/internal-token
            - Name: SIGN_IN_LAMBDA_TOKEN
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/healthbook/cebac/sign-in-lambda-token

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: bitra-cebac-api
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: !ImportValue bitra-cebac-vpc-id
      HealthCheckPath: /up
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  # Solo lo que llega por CloudFront (con el header) y para este host.
  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue bitra-cebac-https-listener-arn
      Priority: 20
      Conditions:
        - Field: host-header
          HostHeaderConfig: { Values: [!Sub 'api.${Domain}'] }
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Ref OriginVerify]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      ServiceName: bitra-api
      Cluster: !ImportValue bitra-cebac-cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Subnets publicas con IP publica, sin NAT (ver el doc).
          AssignPublicIp: ENABLED
          Subnets: !Split [',', !ImportValue bitra-cebac-subnet-ids]
          SecurityGroups: [!ImportValue bitra-cebac-tasks-sg]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      # Solo cliente: para llegar a lis-messaging por nombre.
      ServiceConnectConfiguration:
        Enabled: true

  # ---------------------------------------------------------------------------
  # CloudFront y DNS
  # ---------------------------------------------------------------------------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: bitra cebac api
        Enabled: true
        Aliases: [!Sub 'api.${Domain}']
        HttpVersion: http2and3
        IPV6Enabled: true
        # Sudamerica solo esta en PriceClass_All.
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: !Ref EdgeCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: alb
            DomainName: !ImportValue bitra-cebac-alb-dns-name
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerify
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingDisabled
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewerAndCloudFrontHeaders-2022-06: Host, Authorization y CloudFront-Viewer-Address
          OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc

  DnsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'api.${Domain}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        # La zona fija de CloudFront.
        HostedZoneId: Z2FDTNDATAQYW2

  DnsAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'api.${Domain}'
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  ApiUrl:
    Value: !Sub 'https://api.${Domain}'
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  ServiceName:
    Value: !GetAtt Service.Name
