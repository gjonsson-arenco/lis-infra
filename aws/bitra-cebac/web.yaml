AWSTemplateFormatVersion: '2010-09-09'
Description: >
  bitra cebac: bitra-web (Next standalone) en ECS Fargate, detras del ALB comun
  y de CloudFront (cebac.bitra-care.com, con cache de los estaticos).

Parameters:
  ImageTag:
    Type: String
    Description: Tag de bitra-web en ECR (cebac-<sha>). La imagen ya trae los NEXT_PUBLIC_*.
  DesiredCount:
    Type: Number
    Default: 1
  Domain:
    Type: String
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  EdgeCertificateArn:
    Type: String
  OriginVerify:
    Type: String
    NoEcho: true

Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: bitra-cebac-web
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !ImportValue bitra-cebac-execution-role-arn
      ContainerDefinitions:
        - Name: web
          Image: !Sub
            - '${Repository}:${ImageTag}'
            - Repository: !ImportValue bitra-cebac-web-repository-uri
          Essential: true
          PortMappings:
            - Name: web
              ContainerPort: 3000
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue bitra-cebac-web-log-group
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: bitra-cebac-web
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      VpcId: !ImportValue bitra-cebac-vpc-id
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue bitra-cebac-https-listener-arn
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig: { Values: [!Ref Domain] }
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Ref OriginVerify]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      ServiceName: bitra-web
      Cluster: !ImportValue bitra-cebac-cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', !ImportValue bitra-cebac-subnet-ids]
          SecurityGroups: [!ImportValue bitra-cebac-tasks-sg]
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: bitra cebac web
        Enabled: true
        Aliases: [!Ref Domain]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: !Ref EdgeCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: alb
            DomainName: !ImportValue bitra-cebac-alb-dns-name
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerify
        # Las paginas no se cachean: dependen de la sesion del navegador.
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingDisabled
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewer: el ALB rutea por Host
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        # Los archivos de Next llevan hash en el nombre: se cachean sin invalidar.
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            # Managed-CachingOptimized
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

  DnsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref Domain
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DnsAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref Domain
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  WebUrl:
    Value: !Sub 'https://${Domain}'
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
