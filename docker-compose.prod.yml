networks:
  lis-network:
    external: true

services:
  # LIS Backend (Laravel + PHP-FPM)
  backend:
    build:
      context: /opt/lis/lis-backend
      dockerfile: Dockerfile.prod
    image: lis-backend:cebac-current
    container_name: lis-backend
    restart: unless-stopped
    env_file: /opt/lis/lis-backend/.env.prod
    environment:
      # Override for Docker environment
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    networks:
      - lis-network
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "fopen('http://127.0.0.1:8000/health', 'r');"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - backend-logs:/var/www/storage/logs


  # Broker Gateway (NestJS)
  broker-gateway:
    build:
      context: /opt/lis/lis-broker-gateway
      dockerfile: Dockerfile.prod
    image: lis-broker-gateway:cebac-current
    container_name: lis-broker-gateway
    restart: unless-stopped
    env_file: /opt/lis/lis-broker-gateway/.env.prod
    environment:
      # Service discovery
      BACKEND_URL: http://backend:8000
      REDIS_HOST: redis
    ports:
      - "3001:3001"
    networks:
      - lis-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/v1/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - broker-logs:/app/logs

  # Frontend (Next.js)
  frontend:
    build:
      context: /opt/lis/lis-front-monorepo
      dockerfile: Dockerfile.prod
    image: lis-frontend:cebac-current
    container_name: lis-frontend
    restart: unless-stopped
    env_file: /opt/lis/lis-front-monorepo/apps/lis/.env.prod
    environment:
      # Service discovery URLs (internal)
      NEXT_PUBLIC_API_CORE_URL: http://backend:8000
      NEXT_PUBLIC_API_AUTH_URL: http://backend:8000
      NEXT_PUBLIC_API_CATALOG_URL: http://backend:8000
      NEXT_PUBLIC_API_BROKER_GATEWAY_URL: http://broker-gateway:3001
      # Cognito (these come from .env.prod)
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - lis-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - frontend-logs:/app/.next

  # Clinical Matcher (FastAPI)
  clinical-matcher:
    build:
      context: /opt/lis/lis-clinical-matcher
      dockerfile: Dockerfile.prod
    image: lis-clinical-matcher:cebac-current
    container_name: lis-clinical-matcher
    restart: unless-stopped
    env_file: /opt/lis/lis-clinical-matcher/.env.prod
    environment:
      # Service discovery
      BACKEND_URL: http://backend:8000
    ports:
      - "8001:8001"
    networks:
      - lis-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - matcher-logs:/app/logs

volumes:
  backend-logs:
    driver: local
  broker-logs:
    driver: local
  frontend-logs:
    driver: local
  matcher-logs:
    driver: local
