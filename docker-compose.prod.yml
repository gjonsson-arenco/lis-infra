networks:
  lis-network:
    external: true

services:
  # LIS Backend (Laravel + PHP-FPM)
  backend:
    build:
      context: /opt/lis/lis-backend
      dockerfile: Dockerfile.prod
    image: lis-backend:cebac-current
    container_name: lis-backend
    restart: unless-stopped
    env_file: /opt/lis/lis-backend/.env.prod
    environment:
      # Override for Docker environment
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      # Rules engine de facturación. OJO: no es opcional — AdmissionValuationService
      # llama al engine en TODA valorización (quote), sin feature flag y sin
      # fallback, así que si rules-engine no responde el quote devuelve 500.
      # LIS_RULES_ENGINE_ENABLED solo gobierna la notificación de reload que el
      # backend manda cuando se edita una regla en el ABM.
      LIS_RULES_ENGINE_ENABLED: "true"
      LIS_RULES_ENGINE_BASE_URL: http://rules-engine:3010
      # Mismo valor a los dos lados: el backend lo manda como X-Internal-Token al
      # engine, y el engine lo manda de vuelta al backend para leer el catálogo
      # de reglas (middleware internal.service:lis_rules_engine). Centralizado en
      # el .env de lis-infra, no duplicado en cada .env.prod (guía §6.4).
      LIS_RULES_ENGINE_INTERNAL_TOKEN: ${LIS_RULES_ENGINE_INTERNAL_TOKEN}
      LIS_RULES_ENGINE_TENANT_ID: ${LIS_RULES_ENGINE_TENANT_ID:-lis-default}
    networks:
      - lis-network
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      # PHP-FPM speaks FastCGI, not HTTP — a plain HTTP client against this
      # port always fails/hangs, so this only checks the port is listening.
      test: ["CMD", "nc", "-z", "127.0.0.1", "8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - backend-storage:/var/www/storage
      # Los PDF de indicaciones (printables de los requisitos) NO están en el
      # repo: viven bajo storage/, que está gitignoreado. Como bind mount viven
      # en el host, fuera del ciclo de vida de la imagen Y del volumen: se ven
      # con `ls`, se copian con scp/rsync sin pasar por `docker cp`, entran en
      # cualquier backup del server y sobreviven incluso a un
      # `docker compose down -v`.
      #
      # Va montado ADENTRO de backend-storage: Docker aplica los mounts por
      # profundidad de path, así que este pisa esa subcarpeta y el resto de
      # storage/ (logs, cache, documents/ que sí escribe la app) sigue en el
      # volumen.
      #
      # `ro` porque hoy la app solo los lee (RequirementDocumentService sirve
      # el archivo; no hay endpoint que suba printables). Si algún día se sube
      # uno desde el ABM, sacar el `:ro`.
      #
      # El host dir tiene que existir antes del primer `up` — lo crea
      # scripts/copy-requirements.sh; si no existe, Docker lo crea root:root y
      # después el deploy no puede escribir ahí.
      - /opt/lis/storage/requirements:/var/www/storage/app/private/requirements:ro

  # Internal-only FastCGI-to-HTTP translator for backend. PHP-FPM doesn't
  # speak HTTP, so broker-gateway/clinical-matcher can't call it directly —
  # see nginx/backend-proxy.conf for why this is a separate container from
  # the public-facing nginx (avoids a circular depends_on).
  backend-proxy:
    image: nginx:1.27-alpine
    container_name: lis-backend-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/backend-proxy.conf:/etc/nginx/nginx.conf:ro
    networks:
      - lis-network
    depends_on:
      backend:
        condition: service_healthy

  # Broker Gateway (NestJS)
  broker-gateway:
    build:
      context: /opt/lis/lis-broker-gateway
      dockerfile: Dockerfile.prod
    image: lis-broker-gateway:cebac-current
    container_name: lis-broker-gateway
    restart: unless-stopped
    env_file: /opt/lis/lis-broker-gateway/.env.prod
    environment:
      # Service discovery — via backend-proxy, not backend directly (see
      # backend-proxy's comment above for why)
      BACKEND_URL: http://backend-proxy:8080
      REDIS_HOST: redis
    networks:
      - lis-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/v1/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - broker-logs:/app/logs

  # Frontend (Next.js)
  frontend:
    build:
      context: /opt/lis/lis-front-monorepo
      dockerfile: Dockerfile.prod
      args:
        # NEXT_PUBLIC_* vars are inlined at build time, so they have to
        # come in as build args, not container environment — see
        # Dockerfile.prod. Sourced from the shell env, populated by
        # `set -a && source apps/lis/.env.prod` before `docker compose build`.
        - NEXT_PUBLIC_COGNITO_DOMAIN
        - NEXT_PUBLIC_COGNITO_CLIENT_ID
        - NEXT_PUBLIC_COGNITO_REDIRECT_URI
        - NEXT_PUBLIC_COGNITO_LOGOUT_URI
        - NEXT_PUBLIC_COGNITO_SCOPE
        - NEXT_PUBLIC_API_CORE_URL
        - NEXT_PUBLIC_API_AUTH_URL
        - NEXT_PUBLIC_API_CATALOG_URL
        - NEXT_PUBLIC_API_BROKER_GATEWAY_URL
        - NEXT_PUBLIC_API_CHAT_URL
        - NEXT_PUBLIC_TENANT_ID
        - NEXT_PUBLIC_AUTH_USE_MOCK
        - NEXT_PUBLIC_AUTH_DEBUG_KEEP_POPUP_OPEN
        - NEXT_PUBLIC_ENABLE_DOCUMENT_ANALYSIS
        - NEXT_PUBLIC_ENABLE_CLINICAL_MATCHING
    image: lis-frontend:cebac-current
    container_name: lis-frontend
    restart: unless-stopped
    env_file: /opt/lis/lis-front-monorepo/apps/lis/.env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      # Next.js standalone server binds to $HOSTNAME if set, and Docker
      # sets it to the container ID by default — which resolves to the
      # container's own network IP, not loopback. Without this, nothing
      # inside the container (including its own healthcheck) can reach it
      # via localhost, even though other containers reach it fine via
      # its Docker DNS name.
      HOSTNAME: "0.0.0.0"
    networks:
      - lis-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - frontend-logs:/app/.next

  # Clinical Matcher (FastAPI)
  clinical-matcher:
    build:
      context: /opt/lis/lis-clinical-matcher
      dockerfile: Dockerfile.prod
    image: lis-clinical-matcher:cebac-current
    container_name: lis-clinical-matcher
    restart: unless-stopped
    env_file: /opt/lis/lis-clinical-matcher/.env.prod
    environment:
      # The catalog HTTP client reads CATALOG_API_BASE_URL, not BACKEND_URL
      # (BACKEND_URL isn't referenced anywhere in this app's code — dead
      # var). Without it, this defaulted to http://127.0.0.1:8000, i.e.
      # nothing, inside clinical-matcher's own container.
      CATALOG_API_BASE_URL: http://backend-proxy:8080
      # Must match backend's LIS_MATCHER_INTERNAL_TOKEN exactly (sent as
      # X-Internal-Token). Both are still the placeholder value from the
      # first deploy — rotate together before real production use.
      CATALOG_API_INTERNAL_TOKEN: ${LIS_MATCHER_INTERNAL_TOKEN}
    networks:
      - lis-network
    depends_on:
      backend:
        condition: service_healthy
      backend-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - matcher-logs:/app/logs

  # Rules Engine (Fastify/TypeScript) — motor de reglas de facturación.
  #
  # No lleva env_file: toda su configuración entra por `environment` desde el
  # .env de lis-infra, así que no hay que crear ningún .env.prod a mano en
  # /opt/lis/lis-rules-engine.
  #
  # Tampoco lleva base de datos: el catálogo de reglas vive en MySQL, es del
  # backend, y el engine lo consume por HTTP. El Postgres/Prisma del repo solo
  # lo usa /api/v1/rules/evaluate, que este stack no consume (ver README del
  # repo y §1 de la guía de deploy).
  rules-engine:
    build:
      context: /opt/lis/lis-rules-engine
      dockerfile: Dockerfile.prod
    image: lis-rules-engine:cebac-current
    container_name: lis-rules-engine
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      LOG_LEVEL: info
      # Vía backend-proxy, no backend directo: PHP-FPM habla FastCGI, no HTTP
      # (mismo motivo que clinical-matcher/broker-gateway).
      BACKEND_BASE_URL: http://backend-proxy:8080
      BACKEND_INTERNAL_TOKEN: ${LIS_RULES_ENGINE_INTERNAL_TOKEN}
      # Tiene que ser el MISMO tenant que manda el backend en cada request: la
      # cache del catálogo está keyeada por tenantId, y si el warmup calienta
      # otro tenant, /billing/evaluate responde 500 con la cache "vacía".
      TENANT_ID: ${LIS_RULES_ENGINE_TENANT_ID:-lis-default}
      BACKEND_TIMEOUT_MS: 5000
      RULE_CACHE_TTL_SECONDS: 300
    networks:
      - lis-network
    depends_on:
      backend:
        condition: service_healthy
      backend-proxy:
        condition: service_started
    healthcheck:
      # No es el mismo one-liner que broker-gateway/frontend: ese no consume la
      # respuesta y el proceso queda vivo hasta el keep-alive del server (72s en
      # Fastify) — siempre timeout, contenedor `unhealthy` con la app sana. Y
      # como nginx depende de rules-engine healthy, nginx no arrancaría nunca.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health',(r)=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Chat interno (NestJS + Socket.io) — mensajería entre usuarios del LIS.
  #
  # No lleva env_file (igual que rules-engine): toda su configuración entra por
  # `environment` desde el .env de lis-infra, así que no hay ningún .env.prod
  # que crear a mano en /opt/lis/lis-chat-service.
  #
  # Tiene BASE DE DATOS PROPIA (`lis_chat`), separada de la del LIS pero dentro
  # de la misma instancia de MySQL. La base y su usuario NO los crea el
  # contenedor de MySQL: los scripts de /docker-entrypoint-initdb.d solo corren
  # con el datadir vacío, y el de este server ya tiene la base del LIS. Los crea
  # scripts/create-chat-db.sh, que redeploy.sh llama en cada deploy. Las TABLAS
  # sí se crean solas: con DB_RUN_MIGRATIONS=true TypeORM corre las migraciones
  # pendientes al arrancar.
  chat-service:
    build:
      context: /opt/lis/lis-chat-service
      # El repo tiene un solo Dockerfile y ya es de producción (multi-stage,
      # `npm ci --omit=dev`, USER node); no hay Dockerfile.prod como en los
      # otros repos.
      dockerfile: Dockerfile
    image: lis-chat-service:cebac-current
    container_name: lis-chat-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 3002 y no el 3001 que trae por defecto el repo: ese puerto ya lo publica
      # broker-gateway en el host. En este stack cada servicio usa el mismo
      # número adentro y afuera, así que se cambia acá y no solo en nginx.
      PORT: 3002
      GLOBAL_PREFIX: api/v1
      LOG_LEVEL: info
      # Origen del navegador, para el handshake de Socket.io y el CORS del
      # espejo REST. Vacío = cualquier origen; el valor real va en el .env de
      # lis-infra (la URL del frontend, puerto 3000).
      CORS_ORIGINS: ${LIS_CHAT_CORS_ORIGINS:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_CHAT_DATABASE:-lis_chat}
      MYSQL_USER: ${MYSQL_CHAT_USER:-lis_chat_user}
      MYSQL_PASSWORD: ${MYSQL_CHAT_PASSWORD}
      DB_SYNCHRONIZE: "false"
      DB_RUN_MIGRATIONS: "true"
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: lis:chat
      # Vía backend-proxy, no backend directo (PHP-FPM habla FastCGI, mismo
      # motivo que clinical-matcher/broker-gateway/rules-engine). El chat no
      # sabe de Cognito: valida cada token contra GET /api/v1/chat/identity del
      # backend, que es su única autoridad sobre la identidad. Si el backend no
      # responde, nadie se puede conectar al chat.
      BACKEND_URL: http://backend-proxy:8080
      BACKEND_TIMEOUT_MS: 5000
      IDENTITY_CACHE_TTL: 300
    networks:
      - lis-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend-proxy:
        condition: service_started
    healthcheck:
      # /health queda fuera de GLOBAL_PREFIX a propósito (main.ts lo excluye).
      # wget y no curl: node:20-alpine trae el busybox, no curl.
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Nginx — TLS termination in front of the 6 services above. Self-signed
  # cert (see nginx/generate-self-signed-cert.sh); browsers will warn on
  # first visit to each origin until the cert is accepted/trusted.
  nginx:
    image: nginx:1.27-alpine
    container_name: lis-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "3000:3000"
      - "8000:8000"
      - "3001:3001"
      - "8001:8001"
      - "3010:3010"
      - "3002:3002"
    networks:
      - lis-network
    depends_on:
      # chat-service NO está acá a propósito, a diferencia de los otros cinco:
      # nginx no arranca hasta que todos sus depends_on estén healthy, así que
      # un chat roto (base sin crear, migración fallida) dejaría caído el sitio
      # entero. Su server block resuelve el upstream por DNS en cada request
      # (ver nginx.conf), así que sin chat solo se cae el 3002.
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      broker-gateway:
        condition: service_healthy
      clinical-matcher:
        condition: service_healthy
      rules-engine:
        condition: service_healthy

volumes:
  backend-storage:
    driver: local
  broker-logs:
    driver: local
  frontend-logs:
    driver: local
  matcher-logs:
    driver: local
