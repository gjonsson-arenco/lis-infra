networks:
  lis-network:
    external: true

services:
  # LIS Backend (Laravel + PHP-FPM)
  backend:
    build:
      context: /opt/lis/lis-backend
      dockerfile: Dockerfile.prod
    image: lis-backend:cebac-current
    container_name: lis-backend
    restart: unless-stopped
    env_file: /opt/lis/lis-backend/.env.prod
    environment:
      # Override for Docker environment
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      # Rules engine de facturación. OJO: no es opcional — AdmissionValuationService
      # llama al engine en TODA valorización (quote), sin feature flag y sin
      # fallback, así que si rules-engine no responde el quote devuelve 500.
      # LIS_RULES_ENGINE_ENABLED solo gobierna la notificación de reload que el
      # backend manda cuando se edita una regla en el ABM.
      LIS_RULES_ENGINE_ENABLED: "true"
      LIS_RULES_ENGINE_BASE_URL: http://rules-engine:3010
      # Mismo valor a los dos lados: el backend lo manda como X-Internal-Token al
      # engine, y el engine lo manda de vuelta al backend para leer el catálogo
      # de reglas (middleware internal.service:lis_rules_engine). Centralizado en
      # el .env de lis-infra, no duplicado en cada .env.prod (guía §6.4).
      LIS_RULES_ENGINE_INTERNAL_TOKEN: ${LIS_RULES_ENGINE_INTERNAL_TOKEN}
      LIS_RULES_ENGINE_TENANT_ID: ${LIS_RULES_ENGINE_TENANT_ID:-lis-default}
      # Eventos de dominio hacia lis-orchestrator: cada orden creada se publica
      # en un stream de Redis. predis y no phpredis: la extensión no está en la
      # imagen, y el paquete va en composer. El backend nunca falla por esto:
      # si Redis no está, loguea y sigue; la orden se reenvía desde el LIS.
      REDIS_CLIENT: predis
      DOMAIN_EVENTS_ENABLED: "true"
      DOMAIN_EVENTS_ORDER_STREAM: lis:events:order
      LIS_ORCHESTRATOR_INTERNAL_TOKEN: ${LIS_ORCHESTRATOR_INTERNAL_TOKEN}
      # Para el tablero de conexiones: el backend le pregunta su estado.
      LIS_ORCHESTRATOR_BASE_URL: http://orchestrator:3020
      # Búsqueda sincrónica de pacientes en Labcore desde la admisión: el
      # backend le pega directo al adapter (sin orchestrator). Timeout corto:
      # si Labcore no contesta, la búsqueda sigue con los pacientes del LIS.
      # Cubre adapter + Labcore API + SQL Server de Labcore; si la base del
      # cliente es lenta se sube desde el .env, no acá.
      LIS_ADAPTER_LABCORE_PATIENT_LOOKUP: ${LIS_ADAPTER_LABCORE_PATIENT_LOOKUP:-true}
      LIS_ADAPTER_LABCORE_BASE_URL: http://adapter-labcore:3021
      LIS_ADAPTER_LABCORE_INTERNAL_TOKEN: ${LIS_ADAPTER_LABCORE_INTERNAL_TOKEN}
      LIS_ADAPTER_LABCORE_TIMEOUT_SECONDS: ${LIS_ADAPTER_LABCORE_TIMEOUT_SECONDS:-5}
      # Facturación electrónica: la caja emite contra ARCA a través del
      # gateway, que además NUMERA (la correlatividad la lleva ARCA). Con
      # BILLING_AUTHORITY=mock el CAE se inventa y el gateway no se toca:
      # sirve para probar el circuito sin certificado.
      BILLING_AUTHORITY: ${BILLING_AUTHORITY:-mock}
      LIS_ARCA_GATEWAY_BASE_URL: http://arca-gateway:8000
      LIS_ARCA_GATEWAY_INTERNAL_TOKEN: ${LIS_ARCA_GATEWAY_INTERNAL_TOKEN}
      # Generoso: adentro del gateway hay dos round-trips SOAP contra ARCA.
      LIS_ARCA_GATEWAY_TIMEOUT_SECONDS: ${LIS_ARCA_GATEWAY_TIMEOUT_SECONDS:-45}
      # El CUIT y el punto de venta salen de las MISMAS variables que usa el
      # gateway: si no coinciden, ARCA rechaza por punto de venta no
      # habilitado o el QR del ticket queda con un CUIT que no es el que
      # firmó. La estación puede pisar el punto de venta desde el ABM; esto
      # es el default. Los datos del emisor que se imprimen
      # (BILLING_ISSUER_*) van en el .env.prod del backend.
      BILLING_CUIT: ${ARCA_CUIT}
      BILLING_POINT_OF_SALE: ${ARCA_POINT_OF_SALE}
      # Documentos impresos (ticket fiscal, informes): los dibuja
      # reporting-service. El bucket/key del template tienen que caer dentro
      # de la allowlist de ese servicio (ver más abajo).
      LIS_REPORTING_SERVICE_BASE_URL: http://reporting-service:3030
      LIS_REPORTING_SERVICE_INTERNAL_TOKEN: ${LIS_REPORTING_SERVICE_INTERNAL_TOKEN}
      # El primer ticket de la mañana espera a que arranque Chromium; los
      # siguientes salen en poco más de 100ms.
      LIS_REPORTING_SERVICE_TIMEOUT_SECONDS: ${LIS_REPORTING_SERVICE_TIMEOUT_SECONDS:-20}
    networks:
      - lis-network
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      # PHP-FPM speaks FastCGI, not HTTP — a plain HTTP client against this
      # port always fails/hangs, so this only checks the port is listening.
      test: ["CMD", "nc", "-z", "127.0.0.1", "8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - backend-storage:/var/www/storage
      # Los PDF de indicaciones (printables de los requisitos) NO están en el
      # repo: viven bajo storage/, que está gitignoreado. Como bind mount viven
      # en el host, fuera del ciclo de vida de la imagen Y del volumen: se ven
      # con `ls`, se copian con scp/rsync sin pasar por `docker cp`, entran en
      # cualquier backup del server y sobreviven incluso a un
      # `docker compose down -v`.
      #
      # Va montado ADENTRO de backend-storage: Docker aplica los mounts por
      # profundidad de path, así que este pisa esa subcarpeta y el resto de
      # storage/ (logs, cache, documents/ que sí escribe la app) sigue en el
      # volumen.
      #
      # `ro` porque hoy la app solo los lee (RequirementDocumentService sirve
      # el archivo; no hay endpoint que suba printables). Si algún día se sube
      # uno desde el ABM, sacar el `:ro`.
      #
      # El host dir tiene que existir antes del primer `up` — lo crea
      # scripts/copy-requirements.sh; si no existe, Docker lo crea root:root y
      # después el deploy no puede escribir ahí.
      - /opt/lis/storage/requirements:/var/www/storage/app/private/requirements:ro

  # Internal-only FastCGI-to-HTTP translator for backend. PHP-FPM doesn't
  # speak HTTP, so broker-gateway/clinical-matcher can't call it directly —
  # see nginx/backend-proxy.conf for why this is a separate container from
  # the public-facing nginx (avoids a circular depends_on).
  backend-proxy:
    image: nginx:1.27-alpine
    container_name: lis-backend-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/backend-proxy.conf:/etc/nginx/nginx.conf:ro
    networks:
      - lis-network
    depends_on:
      backend:
        condition: service_healthy

  # Broker Gateway (NestJS)
  broker-gateway:
    build:
      context: /opt/lis/lis-broker-gateway
      dockerfile: Dockerfile.prod
    image: lis-broker-gateway:cebac-current
    container_name: lis-broker-gateway
    restart: unless-stopped
    env_file: /opt/lis/lis-broker-gateway/.env.prod
    environment:
      # Service discovery — via backend-proxy, not backend directly (see
      # backend-proxy's comment above for why)
      BACKEND_URL: http://backend-proxy:8080
      REDIS_HOST: redis
    networks:
      - lis-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/v1/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - broker-logs:/app/logs

  # Frontend (Next.js)
  frontend:
    build:
      context: /opt/lis/lis-front-monorepo
      dockerfile: Dockerfile.prod
      args:
        # NEXT_PUBLIC_* vars are inlined at build time, so they have to
        # come in as build args, not container environment — see
        # Dockerfile.prod. Sourced from the shell env, populated by
        # `set -a && source apps/lis/.env.prod` before `docker compose build`.
        - NEXT_PUBLIC_COGNITO_DOMAIN
        - NEXT_PUBLIC_COGNITO_CLIENT_ID
        - NEXT_PUBLIC_COGNITO_REDIRECT_URI
        - NEXT_PUBLIC_COGNITO_LOGOUT_URI
        - NEXT_PUBLIC_COGNITO_SCOPE
        - NEXT_PUBLIC_API_CORE_URL
        - NEXT_PUBLIC_API_AUTH_URL
        - NEXT_PUBLIC_API_CATALOG_URL
        - NEXT_PUBLIC_API_BROKER_GATEWAY_URL
        - NEXT_PUBLIC_API_CHAT_URL
        - NEXT_PUBLIC_TENANT_ID
        - NEXT_PUBLIC_AUTH_USE_MOCK
        - NEXT_PUBLIC_AUTH_DEBUG_KEEP_POPUP_OPEN
        - NEXT_PUBLIC_ENABLE_DOCUMENT_ANALYSIS
        - NEXT_PUBLIC_ENABLE_CLINICAL_MATCHING
        # Domicilio del paciente: proveedor de geolocalización y su clave de
        # browser (restringida por referrer al dominio del LIS).
        - NEXT_PUBLIC_GEO_PROVIDER
        - NEXT_PUBLIC_GEO_REGION
        - NEXT_PUBLIC_GEO_LANGUAGE
        - NEXT_PUBLIC_GEO_BIAS_LAT
        - NEXT_PUBLIC_GEO_BIAS_LNG
        - NEXT_PUBLIC_GEO_BIAS_RADIUS_M
        - NEXT_PUBLIC_AWS_LOCATION_KEY
        - NEXT_PUBLIC_AWS_LOCATION_REGION
        - NEXT_PUBLIC_AWS_LOCATION_MAP_STYLE
        - NEXT_PUBLIC_GOOGLE_MAPS_KEY
        - NEXT_PUBLIC_GOOGLE_MAP_ID
    image: lis-frontend:cebac-current
    container_name: lis-frontend
    restart: unless-stopped
    env_file: /opt/lis/lis-front-monorepo/apps/lis/.env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      # Next.js standalone server binds to $HOSTNAME if set, and Docker
      # sets it to the container ID by default — which resolves to the
      # container's own network IP, not loopback. Without this, nothing
      # inside the container (including its own healthcheck) can reach it
      # via localhost, even though other containers reach it fine via
      # its Docker DNS name.
      HOSTNAME: "0.0.0.0"
    networks:
      - lis-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - frontend-logs:/app/.next

  # Clinical Matcher (FastAPI)
  clinical-matcher:
    build:
      context: /opt/lis/lis-clinical-matcher
      dockerfile: Dockerfile.prod
    image: lis-clinical-matcher:cebac-current
    container_name: lis-clinical-matcher
    restart: unless-stopped
    env_file: /opt/lis/lis-clinical-matcher/.env.prod
    environment:
      # The catalog HTTP client reads CATALOG_API_BASE_URL, not BACKEND_URL
      # (BACKEND_URL isn't referenced anywhere in this app's code — dead
      # var). Without it, this defaulted to http://127.0.0.1:8000, i.e.
      # nothing, inside clinical-matcher's own container.
      CATALOG_API_BASE_URL: http://backend-proxy:8080
      # Must match backend's LIS_MATCHER_INTERNAL_TOKEN exactly (sent as
      # X-Internal-Token). Both are still the placeholder value from the
      # first deploy — rotate together before real production use.
      CATALOG_API_INTERNAL_TOKEN: ${LIS_MATCHER_INTERNAL_TOKEN}
    networks:
      - lis-network
    depends_on:
      backend:
        condition: service_healthy
      backend-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - matcher-logs:/app/logs

  # Rules Engine (Fastify/TypeScript) — motor de reglas de facturación.
  #
  # No lleva env_file: toda su configuración entra por `environment` desde el
  # .env de lis-infra, así que no hay que crear ningún .env.prod a mano en
  # /opt/lis/lis-rules-engine.
  #
  # Tampoco lleva base de datos: el catálogo de reglas vive en MySQL, es del
  # backend, y el engine lo consume por HTTP. El Postgres/Prisma del repo solo
  # lo usa /api/v1/rules/evaluate, que este stack no consume (ver README del
  # repo y §1 de la guía de deploy).
  rules-engine:
    build:
      context: /opt/lis/lis-rules-engine
      dockerfile: Dockerfile.prod
    image: lis-rules-engine:cebac-current
    container_name: lis-rules-engine
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      LOG_LEVEL: info
      # Vía backend-proxy, no backend directo: PHP-FPM habla FastCGI, no HTTP
      # (mismo motivo que clinical-matcher/broker-gateway).
      BACKEND_BASE_URL: http://backend-proxy:8080
      BACKEND_INTERNAL_TOKEN: ${LIS_RULES_ENGINE_INTERNAL_TOKEN}
      # Tiene que ser el MISMO tenant que manda el backend en cada request: la
      # cache del catálogo está keyeada por tenantId, y si el warmup calienta
      # otro tenant, /billing/evaluate responde 500 con la cache "vacía".
      TENANT_ID: ${LIS_RULES_ENGINE_TENANT_ID:-lis-default}
      BACKEND_TIMEOUT_MS: 5000
      RULE_CACHE_TTL_SECONDS: 300
    networks:
      - lis-network
    depends_on:
      backend:
        condition: service_healthy
      backend-proxy:
        condition: service_started
    healthcheck:
      # No es el mismo one-liner que broker-gateway/frontend: ese no consume la
      # respuesta y el proceso queda vivo hasta el keep-alive del server (72s en
      # Fastify) — siempre timeout, contenedor `unhealthy` con la app sana. Y
      # como nginx depende de rules-engine healthy, nginx no arrancaría nunca.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health',(r)=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Chat interno (NestJS + Socket.io) — mensajería entre usuarios del LIS.
  #
  # No lleva env_file (igual que rules-engine): toda su configuración entra por
  # `environment` desde el .env de lis-infra, así que no hay ningún .env.prod
  # que crear a mano en /opt/lis/lis-chat-service.
  #
  # Tiene BASE DE DATOS PROPIA (`lis_chat`), separada de la del LIS pero dentro
  # de la misma instancia de MySQL. La base y su usuario NO los crea el
  # contenedor de MySQL: los scripts de /docker-entrypoint-initdb.d solo corren
  # con el datadir vacío, y el de este server ya tiene la base del LIS. Los crea
  # scripts/create-chat-db.sh, que redeploy.sh llama en cada deploy. Las TABLAS
  # sí se crean solas: con DB_RUN_MIGRATIONS=true TypeORM corre las migraciones
  # pendientes al arrancar.
  chat-service:
    build:
      context: /opt/lis/lis-chat-service
      # El repo tiene un solo Dockerfile y ya es de producción (multi-stage,
      # `npm ci --omit=dev`, USER node); no hay Dockerfile.prod como en los
      # otros repos.
      dockerfile: Dockerfile
    image: lis-chat-service:cebac-current
    container_name: lis-chat-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 3002 y no el 3001 que trae por defecto el repo: ese puerto ya lo publica
      # broker-gateway en el host. En este stack cada servicio usa el mismo
      # número adentro y afuera, así que se cambia acá y no solo en nginx.
      PORT: 3002
      GLOBAL_PREFIX: api/v1
      LOG_LEVEL: info
      # Origen del navegador, para el handshake de Socket.io y el CORS del
      # espejo REST. Vacío = cualquier origen; el valor real va en el .env de
      # lis-infra (la URL del frontend, puerto 3000).
      CORS_ORIGINS: ${LIS_CHAT_CORS_ORIGINS:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_CHAT_DATABASE:-lis_chat}
      MYSQL_USER: ${MYSQL_CHAT_USER:-lis_chat_user}
      MYSQL_PASSWORD: ${MYSQL_CHAT_PASSWORD}
      DB_SYNCHRONIZE: "false"
      DB_RUN_MIGRATIONS: "true"
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: lis:chat
      # Vía backend-proxy, no backend directo (PHP-FPM habla FastCGI, mismo
      # motivo que clinical-matcher/broker-gateway/rules-engine). El chat no
      # sabe de Cognito: valida cada token contra GET /api/v1/chat/identity del
      # backend, que es su única autoridad sobre la identidad. Si el backend no
      # responde, nadie se puede conectar al chat.
      BACKEND_URL: http://backend-proxy:8080
      BACKEND_TIMEOUT_MS: 5000
      IDENTITY_CACHE_TTL: 300
    networks:
      - lis-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend-proxy:
        condition: service_started
    healthcheck:
      # /health queda fuera de GLOBAL_PREFIX a propósito (main.ts lo excluye).
      # wget y no curl: node:20-alpine trae el busybox, no curl.
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Orquestador de eventos (NestJS) — lee `lis:events:order` del Redis del
  # stack y despacha cada orden creada al adapter del proveedor que diga la
  # regla; le informa al backend cada paso por los webhooks internos de
  # integraciones. Sin base propia: su único estado es el consumer group del
  # stream, en Redis. No lleva env_file: toda su configuración entra por
  # `environment` desde el .env de lis-infra.
  #
  # No lo expone nginx: no lo llama nadie desde afuera. Su API (/api/v1/rules)
  # es de diagnóstico y se consulta desde adentro del stack.
  orchestrator:
    build:
      context: /opt/lis/lis-orchestrator
      dockerfile: Dockerfile
    image: lis-orchestrator:cebac-current
    container_name: lis-orchestrator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3020
      GLOBAL_PREFIX: api/v1
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      DOMAIN_EVENTS_ORDER_STREAM: lis:events:order
      CONSUMER_GROUP: lis-orchestrator
      # Vía backend-proxy, no backend directo (PHP-FPM habla FastCGI, mismo
      # motivo que el resto de los servicios Node).
      BACKEND_URL: http://backend-proxy:8080
      BACKEND_INTERNAL_TOKEN: ${LIS_ORCHESTRATOR_INTERNAL_TOKEN}
      BACKEND_TIMEOUT_MS: 5000
      DISPATCH_MAX_ATTEMPTS: 3
      DISPATCH_BACKOFF_BASE_MS: 2000
      DISPATCH_BACKOFF_MAX_MS: 30000
      # La regla "toda orden creada va a Labcore". Los filtros por origen y
      # servicio (LABCORE_ORIGIN_CODES / LABCORE_SERVICE_CODES) van en el .env
      # de lis-infra si hace falta acotarla.
      LABCORE_ENABLED: ${LABCORE_ENABLED:-true}
      LABCORE_ADAPTER_URL: http://adapter-labcore:3021
      LABCORE_ADAPTER_INTERNAL_TOKEN: ${LIS_ADAPTER_LABCORE_INTERNAL_TOKEN}
      LABCORE_ADAPTER_TIMEOUT_MS: 10000
      LABCORE_ORIGIN_CODES: ${LABCORE_ORIGIN_CODES:-}
      LABCORE_SERVICE_CODES: ${LABCORE_SERVICE_CODES:-}
    networks:
      - lis-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend-proxy:
        condition: service_started
      adapter-labcore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3020/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Adapter de Labcore (NestJS) — traduce la orden canónica al formato de
  # Labcore y la envía a su API. Stateless: lo llaman el orchestrator (órdenes)
  # y el backend (búsqueda de pacientes) y no habla con nadie más del stack.
  # Tampoco lleva env_file.
  #
  # Habla con la Labcore API (.NET, la administramos nosotros, repo
  # api-lis-labcore): POST /api/v1/orders y GET /api/v1/patients con
  # X-Api-Key. La API NO corre en este stack: va como servicio de Windows en
  # una máquina del cliente, porque el SQL Server de Labcore (2008 R2) no
  # negocia con el driver de .NET desde Linux. LABCORE_API_URL apunta a esa
  # máquina; LABCORE_API_KEY es la MISMA clave que esa instalación declara en
  # Api:ApiKeys. LABCORE_MODE=stub no llama a nadie y sirve para probar el
  # circuito. El paquete de Windows se arma con
  # scripts/build-labcore-api-windows.ps1.
  #
  # La equivalencia de códigos de catálogo (estudios, muestras, médicos…) y la
  # política para lo no mapeado se administran desde el LIS (Admin >
  # Integraciones) y viajan en cada evento; acá sólo van los fallbacks de los
  # valores fijos que Labcore pide y el LIS no tiene.
  adapter-labcore:
    build:
      context: /opt/lis/lis-adapters/lis-adapter-labcore
      dockerfile: Dockerfile
    image: lis-adapter-labcore:cebac-current
    container_name: lis-adapter-labcore
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3021
      GLOBAL_PREFIX: api/v1
      LOG_LEVEL: info
      INTERNAL_TOKEN: ${LIS_ADAPTER_LABCORE_INTERNAL_TOKEN}
      LABCORE_MODE: ${LABCORE_MODE:-http}
      LABCORE_API_URL: ${LABCORE_API_URL:?LABCORE_API_URL (http://<ip-windows>:5080, la Labcore API como servicio de Windows)}
      LABCORE_API_KEY: ${LABCORE_API_KEY:-}
      LABCORE_API_TIMEOUT_MS: 10000
      LABCORE_PRIORITY_CODE_ROUTINE: ${LABCORE_PRIORITY_CODE_ROUTINE:-}
      LABCORE_PRIORITY_CODE_URGENT: ${LABCORE_PRIORITY_CODE_URGENT:-}
      LABCORE_PATIENT_TYPE_CODE: ${LABCORE_PATIENT_TYPE_CODE:-}
    networks:
      - lis-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3021/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Gateway de facturación electrónica ARCA (FastAPI) — la caja del LIS emite
  # Factura/NC/ND y recibe el CAE en la misma respuesta. Stateless: no lleva
  # base de datos (el LIS es la fuente de verdad, ARCA la de la numeración) ni
  # env_file (toda su config entra por `environment` desde el .env de
  # lis-infra). Su único estado vive en el Redis COMPARTIDO del stack: cache
  # del Ticket de Acceso de WSAA (~12h), lock por punto de venta (una emisión
  # en vuelo por PtoVta, para no romper la correlatividad) e idempotencia por
  # correlation_id. Va namespaceado por REDIS_KEY_PREFIX=arca para no pisar las
  # claves del chat/orchestrator en la misma instancia.
  #
  # No lo expone nginx: el único que lo llama es el backend, por la red de
  # Docker (http://arca-gateway:8000), cuando la caja emite con
  # BILLING_AUTHORITY=arca. Su Dockerfile ya es de producción (no hay
  # Dockerfile.prod), y escucha en 8000 dentro de su propio contenedor: no
  # choca con el backend (otro contenedor, otra IP).
  arca-gateway:
    build:
      context: /opt/lis/lis-arca-gateway
      dockerfile: Dockerfile
    image: lis-arca-gateway:cebac-current
    container_name: lis-arca-gateway
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      # homologation (testing de ARCA) o production. Los WSDL de WSAA/WSFEv1
      # cambian según el ambiente, por eso van explícitos abajo.
      ARCA_ENVIRONMENT: ${ARCA_ENVIRONMENT:-homologation}
      ARCA_CUIT: ${ARCA_CUIT:?ARCA_CUIT (CUIT del emisor, sin guiones)}
      ARCA_POINT_OF_SALE: ${ARCA_POINT_OF_SALE:?ARCA_POINT_OF_SALE (punto de venta habilitado en ARCA)}
      ARCA_SERVICE_NAME: ${ARCA_SERVICE_NAME:-wsfe}
      ARCA_TIMEOUT_SECONDS: ${ARCA_TIMEOUT_SECONDS:-30}
      ARCA_WSAA_WSDL: ${ARCA_WSAA_WSDL:-https://wsaahomo.afip.gov.ar/ws/services/LoginCms?wsdl}
      ARCA_WSFE_WSDL: ${ARCA_WSFE_WSDL:-https://wswhomo.afip.gov.ar/wsfev1/service.asmx?WSDL}
      # El certificado y la clave privada de ARCA NO están en el repo: se montan
      # read-only desde el host (ver volumes). Estas rutas son las de adentro
      # del contenedor.
      ARCA_CERT_PATH: /run/secrets/arca_cert.pem
      ARCA_PRIVATE_KEY_PATH: /run/secrets/arca_key.pem
      # Redis compartido del stack (mismo servicio `redis`), base 0. El prefijo
      # aísla sus claves de las del resto de los servicios.
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: arca
      # Mismo valor que LIS_ARCA_GATEWAY_INTERNAL_TOKEN en el backend. Vacío
      # deja el gateway abierto a cualquiera que esté en la red de Docker.
      INTERNAL_TOKEN: ${LIS_ARCA_GATEWAY_INTERNAL_TOKEN}
    networks:
      - lis-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # La imagen trae curl (lo instala el Dockerfile).
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      # Certificado + clave privada de ARCA, fuera del repo y del ciclo de vida
      # de la imagen. El directorio del host tiene que existir antes del primer
      # `up`, con arca_cert.pem y arca_key.pem adentro (chmod 600); si no
      # existe, Docker lo crea root:root vacío y WSAA falla al firmar el login.
      - /opt/lis/secrets/arca:/run/secrets:ro

  # Servicio de documentos (Fastify + Playwright) — dibuja lo que el LIS
  # imprime: hoy el ticket fiscal de la caja, mañana el informe de resultados.
  # Recibe un payload y devuelve HTML o PDF; no guarda nada (ni el payload, ni
  # el documento, ni el registro de que se lo pidieron): la fuente de verdad es
  # el LIS. Sin base, sin Redis y sin env_file.
  #
  # No lo expone nginx: el único que lo llama es el backend, por la red de
  # Docker. El browser nunca le pega — la caja le pide el ticket al LIS y el
  # LIS le pasa el documento ya dibujado.
  #
  # OJO con el build: la imagen sale de mcr.microsoft.com/playwright, que trae
  # Chromium y sus dependencias. Son ~2 GB y el primer build tarda varios
  # minutos; no es que se colgó.
  reporting-service:
    build:
      context: /opt/lis/lis-reports-engine
      dockerfile: Dockerfile
    image: lis-reporting-service:cebac-current
    container_name: lis-reporting-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3030
      # En producción el servicio NO arranca sin token (main.ts lo chequea).
      # Mismo valor que LIS_REPORTING_SERVICE_INTERNAL_TOKEN en el backend.
      INTERNAL_TOKEN: ${LIS_REPORTING_SERVICE_INTERNAL_TOKEN:?LIS_REPORTING_SERVICE_INTERNAL_TOKEN (token compartido backend <-> reporting-service)}
      # `local` sirve los templates que vienen EN la imagen
      # (src/templates/local-fallback), que es donde vive hoy el ticket de
      # CEBAC: no hace falta S3 ni credenciales de AWS para facturar. Pasar a
      # `s3` sólo cuando los templates se publiquen en el bucket.
      TEMPLATE_SOURCE: ${TEMPLATE_SOURCE:-local}
      TEMPLATE_LOCAL_PATH: /app/src/templates/local-fallback
      # El bucket del request se valida contra esta allowlist INCLUSO en modo
      # local, así que tiene que incluir el de BILLING_DOCUMENT_TEMPLATE_BUCKET
      # del backend (default: lis-report-templates).
      ALLOWED_TEMPLATE_BUCKETS: ${ALLOWED_TEMPLATE_BUCKETS:-lis-report-templates}
      ALLOWED_TEMPLATE_PREFIXES: ${ALLOWED_TEMPLATE_PREFIXES:-customers}
      # Las credenciales de AWS NO van acá a propósito: el servicio valida que,
      # si están, no estén vacías, así que pasarlas en blanco lo tira al
      # arrancar. Al pasar a TEMPLATE_SOURCE=s3 se agregan AWS_REGION,
      # AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY a esta lista, con valor.
      #
      # Bajo /tmp y no bajo /app: el cache es descartable y así no ensucia la
      # capa de la imagen. En modo local no se usa; en modo s3 es donde caen
      # los templates bajados.
      CACHE_DIR: /tmp/reporting-cache
    networks:
      - lis-network
    # Chromium se come el /dev/shm de 64 MB que Docker da por defecto y se cae
    # con "Target closed" a mitad del render. El servicio lo lanza sin
    # --disable-dev-shm-usage, así que la memoria compartida se agranda acá.
    shm_size: 512mb
    healthcheck:
      # La imagen de Playwright no trae wget ni curl, pero sí Node 20 con fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Arranca Chromium recién en el primer render, pero la imagen es grande y
      # el contenedor tarda en estar listo.
      start_period: 30s

  # Nginx — TLS termination in front of the 6 services above. Self-signed
  # cert (see nginx/generate-self-signed-cert.sh); browsers will warn on
  # first visit to each origin until the cert is accepted/trusted.
  nginx:
    image: nginx:1.27-alpine
    container_name: lis-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "3000:3000"
      - "8000:8000"
      - "3001:3001"
      - "8001:8001"
      - "3010:3010"
      - "3002:3002"
    networks:
      - lis-network
    depends_on:
      # chat-service NO está acá a propósito, a diferencia de los otros cinco:
      # nginx no arranca hasta que todos sus depends_on estén healthy, así que
      # un chat roto (base sin crear, migración fallida) dejaría caído el sitio
      # entero. Su server block resuelve el upstream por DNS en cada request
      # (ver nginx.conf), así que sin chat solo se cae el 3002.
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      broker-gateway:
        condition: service_healthy
      clinical-matcher:
        condition: service_healthy
      rules-engine:
        condition: service_healthy

volumes:
  backend-storage:
    driver: local
  broker-logs:
    driver: local
  frontend-logs:
    driver: local
  matcher-logs:
    driver: local
