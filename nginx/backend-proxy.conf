worker_processes auto;

events {
    worker_connections 256;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 25m;

    # Internal-only FastCGI-to-HTTP translator for backend. Plain HTTP, no
    # TLS, never published to the host — only reachable from other
    # containers on lis-network. Exists so clinical-matcher/broker-gateway
    # can reach backend without hitting PHP-FPM's raw FastCGI socket
    # directly (which isn't HTTP and can't be spoken to by a plain HTTP
    # client), without creating a circular dependency on the public-facing
    # nginx (which itself depends on clinical-matcher/broker-gateway being
    # healthy).
    server {
        listen 8080;
        server_name _;

        location / {
            include fastcgi_params;
            fastcgi_pass backend:8000;
            fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        }
    }
}
