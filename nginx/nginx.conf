worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Allow larger document uploads (OCR/document analysis on the backend).
    client_max_body_size 25m;

    # socket.io arranca por long-polling y recién después hace el upgrade a
    # websocket: en esas requests $http_upgrade viene vacío, y mandarle igual
    # `Connection: upgrade` al upstream es pedirle que trate como upgrade algo
    # que no lo es. Este map manda "upgrade" solo cuando el cliente lo pidió, y
    # "close" en el resto.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Frontend (Next.js)
    server {
        listen 3000 ssl;
        server_name _;

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Backend (Laravel API) — PHP-FPM speaks FastCGI, not HTTP, so this talks
    # fastcgi_pass directly instead of proxy_pass like the other 3 services.
    server {
        listen 8000 ssl;
        server_name _;

        location / {
            include fastcgi_params;
            fastcgi_pass backend:8000;
            fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
            fastcgi_param HTTPS on;
        }
    }

    # Broker Gateway (NestJS)
    server {
        listen 3001 ssl;
        server_name _;

        location / {
            proxy_pass http://broker-gateway:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Clinical Matcher (FastAPI) — not called from the browser today, but
    # proxied for consistency and for direct debugging access.
    server {
        listen 8001 ssl;
        server_name _;

        location / {
            proxy_pass http://clinical-matcher:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Chat interno (NestJS + Socket.io). Dos diferencias con los demás:
    #
    #  - Headers de upgrade (como el frontend, pero con el map de arriba): sin
    #    ellos el transporte websocket no completa el handshake y socket.io
    #    queda cayendo a long-polling, o directamente reconectando en loop.
    #  - El upstream se resuelve por DNS EN CADA REQUEST, no una sola vez al
    #    arrancar: `proxy_pass` con una variable obliga a nginx a usar el
    #    resolver. Con el nombre literal, nginx no levanta si el contenedor del
    #    chat no existe/no resuelve ("host not found in upstream") y eso tira
    #    abajo TODO el sitio por un servicio secundario. Así, un chat caído solo
    #    devuelve 502 en este puerto.
    server {
        listen 3002 ssl;
        server_name _;

        # DNS interno de Docker.
        resolver 127.0.0.11 valid=10s;
        set $chat_upstream http://chat-service:3002;

        location / {
            proxy_pass $chat_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Un socket sin actividad no manda nada entre pings; con los 60s por
            # defecto nginx corta la conexión y el cliente reconecta en loop.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # Rules Engine (Fastify) — tampoco lo llama el browser: el backend le pega
    # por la red de Docker (http://rules-engine:3010). Se proxea igual que
    # clinical-matcher, para debug directo (health, reload manual del catálogo).
    server {
        listen 3010 ssl;
        server_name _;

        location / {
            proxy_pass http://rules-engine:3010;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
