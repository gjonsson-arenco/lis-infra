worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Allow larger document uploads (OCR/document analysis on the backend).
    client_max_body_size 25m;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Frontend (Next.js)
    server {
        listen 3000 ssl;
        server_name _;

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Backend (Laravel API) — PHP-FPM speaks FastCGI, not HTTP, so this talks
    # fastcgi_pass directly instead of proxy_pass like the other 3 services.
    server {
        listen 8000 ssl;
        server_name _;

        location / {
            include fastcgi_params;
            fastcgi_pass backend:8000;
            fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
            fastcgi_param HTTPS on;
        }
    }

    # Broker Gateway (NestJS)
    server {
        listen 3001 ssl;
        server_name _;

        location / {
            proxy_pass http://broker-gateway:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Clinical Matcher (FastAPI) — not called from the browser today, but
    # proxied for consistency and for direct debugging access.
    server {
        listen 8001 ssl;
        server_name _;

        location / {
            proxy_pass http://clinical-matcher:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
